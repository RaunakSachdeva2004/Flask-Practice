<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result Page</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            border: 2px solid #ffffff;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            font-size: 1.1rem;
            border: 1px solid #ffffff;
        }
        .pass {
            color: #00ff88;
            border-color: #00ff88;
        }
        .fail {
            color: #ff4d4d;
            border-color: #ff4d4d;
        }
        .result-box h2 {
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        a {
            display: inline-block;
            margin-top: 24px;
            color: #ffffff;
            text-decoration: none;
            border: 1px solid #ffffff;
            padding: 10px 20px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }
        a:hover {
            background-color: #ffffff;
            color: #000000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Examination Result</h1>
        
        {# Jinja2 conditional statement #}
        {% if results == "pass" %}
            <div class="result-box pass">
                <h2>Status: PASSED</h2>
                <p>Congratulations! You have passed the examination.</p>
            </div>
        {% else %}
            <div class="result-box fail">
                <h2>Status: FAILED</h2>
                <p>Sorry, you did not pass. Better luck next time!</p>
            </div>
        {% endif %}

        <p style="margin-top: 15px; color: #aaaaaa;">
            Result value received: <strong>{{ results }}</strong>
        </p>

        <a href="/form">Go to Form</a>
    </div>
</body>
</html>
