<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Welcome</title>
        <style>
            * { box-sizing: border-box; margin: 0; padding: 0; }
            body {
                background-color: #000000;
                color: #ffffff;
                font-family: Arial, Helvetica, sans-serif;
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                padding: 20px;
            }
            .container {
                border: 2px solid #ffffff;
                padding: 40px;
                max-width: 600px;
                width: 100%;
                text-align: center;
            }
            h1 {
                font-size: 2rem;
                margin-bottom: 16px;
                text-transform: uppercase;
                letter-spacing: 1px;
            }
            h2 {
                font-size: 1.2rem;
                font-weight: normal;
                color: #cccccc;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>Welcome to my website</h1>
            <h2>Flask is a web framework for Python.</h2>
        </div>
    </body>
    </html>
