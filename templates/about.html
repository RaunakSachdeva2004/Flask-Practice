<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #000000;
            border: 2px solid #ffffff;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        h2 {
            font-size: 1.2rem;
            font-weight: normal;
            color: #cccccc;
            margin-bottom: 20px;
        }
        p {
            font-size: 1rem;
            line-height: 1.6;
            color: #e0e0e0;
            margin-bottom: 25px;
        }
        .tag {
            display: inline-block;
            border: 1px solid #ffffff;
            padding: 8px 16px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>About This Project</h1>
        <h2>MLOps Bootcamp &bull; Flask Practice</h2>
        <p>This application demonstrates modular routing and template rendering using Flask. Built with a clean 2D monochrome aesthetic.</p>
        <div class="tag">About &bull; Flask 2D</div>
    </div>
</body>
</html>
